<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UnifiedLoanIntelligenceSystem</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark result-page">
    <div class="bg-mesh"></div>

    <nav class="navbar">
        <div class="nav-brand">
            <div class="nav-logo"></div>
            <span class="nav-title">UnifiedLoanIntelligenceSystem</span>
        </div>
        <div class="nav-links">
            <a href="index.html" class="nav-link">Home</a>
            <a href="eligibility.html" class="nav-link">Eligibility</a>
            <a href="emi-calculator.html" class="nav-link">EMI Calculator</a>
        </div>
        <div class="nav-actions">
            <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </nav>

    <div class="result-container">
        <div id="resultCard" class="result-card">
            <!-- Populated by JS -->
        </div>
        <div class="result-actions">
            <a href="index.html" class="btn-primary"><i class="fas fa-redo"></i> New Application</a>
            <a href="emi-calculator.html" class="btn-secondary"><i class="fas fa-calculator"></i> EMI Calculator</a>
        </div>
    </div>

    <script>
        if (sessionStorage.getItem('loggedIn') !== 'true') window.location.href = 'login.html';

        function logout() { sessionStorage.removeItem('loggedIn'); window.location.href = 'login.html'; }

        const data = JSON.parse(sessionStorage.getItem('loanResult') || '{}');
        const demoMode = sessionStorage.getItem('demoMode') === 'true';

        if (!data || !data.hasOwnProperty('eligible')) {
            document.getElementById('resultCard').innerHTML = '<p style="color:#94a3b8;text-align:center;padding:2rem;">No result data found. <a href="index.html" style="color:#818cf8;">Go back</a></p>';
        } else {
            const approved = data.eligible;
            const riskColor = data.risk === 'LOW RISK' ? '#10b981' : data.risk === 'MODERATE RISK' ? '#f59e0b' : '#f43f5e';
            const scoreWidth = Math.min(Math.round((data.aiScore / 90) * 100), 100);

            document.getElementById('resultCard').innerHTML = `
                ${demoMode ? '<div class="result-explanation"><i class="fas fa-circle-info text-indigo"></i><p>Static GitHub Pages demo mode. Run the Java backend locally for the full Spring Boot API version.</p></div>' : ''}
                <div class="result-status ${approved ? 'approved' : 'rejected'}">
                    <div class="result-icon">
                        <i class="fas ${approved ? 'fa-check-circle' : 'fa-times-circle'}"></i>
                    </div>
                    <h2>${approved ? '✅ LOAN APPROVED' : '❌ LOAN DECLINED'}</h2>
                    <p class="applicant-name">Applicant: <strong>${data.applicantName || 'N/A'}</strong></p>
                </div>

                <div class="result-grid">
                    <div class="result-stat">
                        <span class="rs-label">AI Score</span>
                        <span class="rs-value">${data.aiScore}<span class="rs-unit">/90</span></span>
                        <div class="score-bar-bg"><div class="score-bar" style="width:${scoreWidth}%;background:${riskColor};"></div></div>
                    </div>
                    <div class="result-stat">
                        <span class="rs-label">Risk Level</span>
                        <span class="rs-value" style="color:${riskColor}">${data.risk}</span>
                    </div>
                    ${approved ? `
                    <div class="result-stat">
                        <span class="rs-label">Monthly EMI</span>
                        <span class="rs-value text-indigo">₹${Math.round(data.emi).toLocaleString('en-IN')}</span>
                    </div>
                    <div class="result-stat">
                        <span class="rs-label">Total Payable</span>
                        <span class="rs-value">₹${Math.round(data.totalPayable).toLocaleString('en-IN')}</span>
                    </div>
                    <div class="result-stat">
                        <span class="rs-label">Interest Rate</span>
                        <span class="rs-value">${data.interestRate}%</span>
                    </div>
                    <div class="result-stat">
                        <span class="rs-label">Max Eligible</span>
                        <span class="rs-value">₹${Math.round(data.eligibleAmount).toLocaleString('en-IN')}</span>
                    </div>
                    ` : ''}
                </div>

                <div class="result-explanation">
                    <i class="fas fa-robot text-indigo"></i>
                    <p>${data.explanation}</p>
                </div>

                ${approved ? `
                <div class="loan-summary-box">
                    <h4>Loan Summary</h4>
                    <div class="loan-summary-grid">
                        <div><span>Loan Type</span><strong>${data.loanType}</strong></div>
                        <div><span>Loan Amount</span><strong>₹${Math.round(data.loanAmount).toLocaleString('en-IN')}</strong></div>
                        <div><span>Tenure</span><strong>${data.tenureMonths} Months</strong></div>
                    </div>
                </div>` : ''}
            `;
        }
    </script>
</body>
</html>
