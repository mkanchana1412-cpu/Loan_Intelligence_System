<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Loan Application</title>

  <style>
    body { font-family: Arial, sans-serif; background:#f5f6fa; padding: 30px; }
    .card { max-width: 520px; background:#fff; padding: 20px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    h1 { margin-top: 0; }
    label { display:block; margin-top: 12px; font-weight: 600; }
    input { width: 100%; padding: 10px; margin-top: 6px; border: 1px solid #ccc; border-radius: 8px; }
    button { margin-top: 16px; padding: 10px 14px; border: none; border-radius: 8px; background:#2563eb; color: white; font-weight: 700; cursor:pointer; }
    button:hover { background:#1d4ed8; }
    .result { margin-top: 18px; padding: 12px; border-radius: 10px; background:#f1f5f9; }
    .ok { color: #16a34a; font-weight: 800; }
    .no { color: #dc2626; font-weight: 800; }
    .small { color:#334155; margin-top: 6px; }
  </style>
</head>

<body>
  <div class="card">
    <h1>Loan Application</h1>

    <label>Name</label>
    <input id="name" type="text" placeholder="Enter your name" />

    <label>Age</label>
    <input id="age" type="number" placeholder="Enter age" />

    <label>Monthly Income</label>
    <input id="income" type="number" placeholder="Enter monthly income" />

    <label>Credit Score</label>
    <input id="credit" type="number" placeholder="Enter credit score" />

    <button onclick="checkEligibility()">Check Eligibility</button>

    <div id="result" class="result" style="display:none;"></div>
  </div>

  <script>
    async function checkEligibility() {
      const applicantName = document.getElementById("name").value.trim();
      const age = Number(document.getElementById("age").value);
      const monthlyIncome = Number(document.getElementById("income").value);
      const creditScore = Number(document.getElementById("credit").value);

      const resultDiv = document.getElementById("result");
      resultDiv.style.display = "block";
      resultDiv.innerHTML = "Checking...";

      try {
        const res = await fetch("/loan/check", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ applicantName, age, monthlyIncome, creditScore })
        });

        if (!res.ok) {
          resultDiv.innerHTML = "Error: Backend not responding correctly.";
          return;
        }

        const data = await res.json();

        const status = data.eligible
          ? `<div class="ok">✅ ELIGIBLE</div>`
          : `<div class="no">❌ NOT ELIGIBLE</div>`;

        resultDiv.innerHTML =
          status +
          `<div class="small">AI Score: <b>${data.aiScore}</b></div>` +
          `<div class="small">Reason: ${data.reason}</div>`;

      } catch (e) {
        resultDiv.innerHTML = "Error: " + e.message;
      }
    }
  </script>
</body>
</html>
